; A classic ESP32 (WROOM, 16 MB flash, no PSRAM) devboard with a Sharp Memory
; LCD 400x240 and four buttons -- the ESP32 Antenna Tracker board. No LoRa yet:
; the mesh goes over ESP-NOW (WiFi), so two of these talk to each other but not
; to a LoRa network.
;
;   Sharp   VSPI: SCK 18, MOSI 23, CS 5 (active high), VCOM in software
;   Buttons 26 up, 25 down, 35 OK, 34 Back (to GND, pull-ups on the board)
;   GPS     u-blox on HSPI (CS 15) -- not wired up yet
[Sharp_Devboard]
extends = esp32_base
board = esp32dev
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/sharp_devboard
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=22
  -D P_LORA_DIO_1=-1        ; no LoRa: only named by ESP32Board::sleep(), which the companion never calls
  -D PIN_DISPLAY_CS=5
  -D PIN_DISPLAY_SCLK=18
  -D PIN_DISPLAY_MOSI=23
  -D PIN_USER_BTN=35
  -D PIN_BACK_BTN=34
  -D JOYSTICK_UP=26
  -D JOYSTICK_DOWN=25
  -D JOYSTICK_LEFT=-1
  -D JOYSTICK_RIGHT=-1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/sharp_devboard>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit BusIO @ ^1.15.0
  adafruit/Adafruit SHARP Memory Display @ ^1.1.3
