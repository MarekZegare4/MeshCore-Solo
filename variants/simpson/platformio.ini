[Simpson]
extends = Promicro
build_unflags = -D PIN_GPS_RX=3 -D PIN_GPS_TX=4 -D ENV_INCLUDE_AHTX0=1 -D ENV_INCLUDE_BME280=1 -D ENV_INCLUDE_BMP280=1 -D ENV_INCLUDE_INA3221=1 -D ENV_INCLUDE_INA219=1 -D ENV_INCLUDE_INA226=1
build_flags = ${Promicro.build_flags}
  -I variants/simpson
  -D SIMPSON
  -D PIN_BUZZER=0
  -D PIN_GPS_TX=3
  -D PIN_GPS_RX=4
  -D PIN_VIBRATION=1
  -D ADC_MULTIPLIER=1.71
  -D SIMPSON_KEYPAD_ADDR=0x20
  -D DISPLAY_ROTATION=2
  -D ENV_SKIP_GPS_DETECT
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<../variants/simpson>
  +<../variants/promicro/target.cpp>
  +<../variants/promicro/PromicroBoard.cpp>
lib_deps = ${Promicro.lib_deps}
  adafruit/Adafruit SH110X @ ^2.1.13
  RobTillaart/I2CKeyPad @ ^0.5.2
