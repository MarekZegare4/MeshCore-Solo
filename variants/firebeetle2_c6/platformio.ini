; DFRobot FireBeetle 2 ESP32-C6 (DFR1075: 4 MB flash, 512 KB RAM, no PSRAM) on
; a breadboard. The C6 has one general-purpose SPI bus, so the radio, the
; display and the SD card share it, each with its own CS:
;
;   SPI      SCK 23, MOSI 22, MISO 21 (the board's GDI pins)
;   SX1262   Waveshare module: NSS 17, BUSY 8, RESET 14, DIO1 7, RXEN 6;
;            DIO2 switches the antenna, DIO3 powers the 1.8 V TCXO
;   Sharp    LS027 400x240: CS 2 (active high), VCOM in software
;   SD       CS 18
;   I2C      SDA 19, SCL 20: LSM6DS + LIS3MDL (Adafruit 9-DOF)
;   Board    BOOT button 9, LED 15, battery (1:2 divider) 0
;
; Left alone: 12/13 (USB), 24-30 (the flash).
[FireBeetle2_C6]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_build.flash_mode = dio
board_build.partitions = variants/firebeetle2_c6/partitions.csv   ; 2.7 MB app (no OTA), 1.2 MB spiffs
build_flags =
  ${esp32c6_base.build_flags}
  -I variants/firebeetle2_c6
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D PIN_SHARED_SPI_MISO=21
  -D P_LORA_SCLK=23
  -D P_LORA_MISO=21
  -D P_LORA_MOSI=22
  -D P_LORA_NSS=17
  -D P_LORA_BUSY=8
  -D P_LORA_RESET=14
  -D P_LORA_DIO_1=7
  -D SX126X_RXEN=6
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=15
  -D PIN_DISPLAY_CS=2
  -D PIN_DISPLAY_SCLK=23
  -D PIN_DISPLAY_MOSI=22
  -D PIN_SD_CS=18
  -D PIN_BOARD_SDA=19
  -D PIN_BOARD_SCL=20
  -D PIN_VBAT_READ=0
  -D PIN_USER_BTN=9
  -D HAS_COMPASS=1   ; LSM6DS + LIS3MDL: board_compass_read() in target.cpp
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${esp32c6_base.build_src_filter}
  +<../variants/firebeetle2_c6>
lib_deps =
  ${esp32c6_base.lib_deps}
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit BusIO @ ^1.15.0
  adafruit/Adafruit SHARP Memory Display @ ^1.1.3
