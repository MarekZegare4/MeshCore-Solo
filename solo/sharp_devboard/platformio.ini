; Solo on the Sharp devboard (variants/sharp_devboard): ESP-NOW instead of
; LoRa, so not a release build (no _solo_dual suffix). The 400x240 panel is
; laid out as the 4.2" e-ink one, in the 9x15 font.
[env:Sharp_Devboard_espnow_solo]
extends = Sharp_Devboard
build_flags =
  ${Sharp_Devboard.build_flags}
  -I examples/companion_radio/ui-new
  ; A classic ESP32 has ~124 KB for statics, and WiFi (ESP-NOW) and BLE want
  ; their heap: fewer contacts and a shorter offline queue than the S3 boards.
  -D MAX_CONTACTS=150
  -D MAX_GROUP_CHANNELS=20
  ; No Bluetooth yet: Bluedroid's init ran out of heap next to WiFi (ESP-NOW)
  ; and crashed in gatt_init. The app over USB only.
  -D OFFLINE_QUEUE_SIZE=64
  -D FIRMWARE_SOLO_BUILD=1
  -D HIST_FLASH
  -D DISPLAY_CLASS=SharpMemDisplay
  -D EINK_LARGE_FONT=2
  -D UI_HAS_JOYSTICK=1
  -D UI_HAS_JOYSTICK_UPDOWN=1
  -D UI_FOUR_BUTTONS=1   ; Up/Down step through the screen (stepKey), OK on a value row edits it
  -D DISPLAY_AUTO_OFF_SECS=0   ; a memory LCD keeps its picture for nothing: no auto-off by default
build_src_filter = ${Sharp_Devboard.build_src_filter}
  +<helpers/ui/SharpMemDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Sharp_Devboard.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
