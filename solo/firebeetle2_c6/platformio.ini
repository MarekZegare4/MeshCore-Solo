; Solo on the FireBeetle 2 ESP32-C6 breadboard (variants/firebeetle2_c6): LoRa,
; a Sharp 400x240 laid out as the 4.2" e-ink one in the 9x15 font, the app
; over BLE or USB. No joystick: the BOOT button is the one button, and the
; configurator drives the rest with the CLI's `key` (UITask::remoteInput).
; A bring-up build, not a release one.
[env:FireBeetle2_C6_solo]
extends = FireBeetle2_C6
build_flags =
  ${FireBeetle2_C6.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=20
  -D OFFLINE_QUEUE_SIZE=64
  -D BLE_PIN_CODE=123456
  -D DUAL_SERIAL=1
  -D FIRMWARE_SOLO_BUILD=1
  -D HIST_FLASH
  -D DISPLAY_CLASS=SharpMemDisplay
  -D EINK_LARGE_FONT=2
  -D DISPLAY_AUTO_OFF_SECS=0   ; a memory LCD keeps its picture for nothing
  -D ENABLE_SCREENSHOT
build_src_filter = ${FireBeetle2_C6.build_src_filter}
  +<helpers/ui/SharpMemDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${FireBeetle2_C6.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
